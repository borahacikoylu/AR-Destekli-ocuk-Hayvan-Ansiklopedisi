services:
  expo-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ar-hayvan-expo
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      # Kaynak kodunu canlı olarak bağla (hot reload için)
      - .:/app
      # node_modules container içinde kalsın (host ile karışmasın)
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
    stdin_open: true
    tty: true
    restart: unless-stopped
